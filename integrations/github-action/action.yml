name: HermaGuard Code Review
description: >
  Deterministic pre-scan of the changed files. Reports one of four honest states
  (complete, partial, unavailable, out_of_scope) and never calls an LLM.

inputs:
  block_on:
    description: >
      Severity that fails the check: HIGH (default), CRITICAL or never. With HIGH
      or CRITICAL, a partial or unavailable scan also fails - it is not a pass.
      Note: the bundled scanners do not currently report CRITICAL, so CRITICAL
      cannot fail on a scanner finding.
    default: 'HIGH'
  max_files:
    description: If more in-scope files than this changed, none are scanned and the result is partial.
    default: '50'
  skip_patterns:
    description: Comma- or newline-separated glob patterns to leave out of the scan.
    default: '*.test.*,*.spec.*,*.md,*.json,*.yaml'
  prescan_enabled:
    description: Run the deterministic pre-scan. When false, the check reports that nothing was scanned.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install optional linters for the pre-scan
      shell: bash
      run: |
        # Best effort, but never silent: the scanner also reports which tools were missing.
        python3 -m pip install bandit ruff semgrep >/dev/null 2>&1 \
          || echo "::warning::could not install bandit/ruff/semgrep; the scan will be partial"
        npm install -g eslint >/dev/null 2>&1 \
          || echo "::warning::could not install eslint; JS/TS files will not be examined by it"

    - name: Select changed files
      id: files
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.event.after }}
        SKIP_PATTERNS: ${{ inputs.skip_patterns }}
        MAX_FILES: ${{ inputs.max_files }}
      run: |
        python3 "$GITHUB_ACTION_PATH/hg_action.py" select

    - name: Run HermaGuard Pre-Scan
      if: ${{ steps.files.outputs.scan_count != '0' && inputs.prescan_enabled == 'true' }}
      id: prescan
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/hermaguard"
        # A scanner failure is recorded and reported, not hidden: the report step
        # turns a missing or invalid report into the `unavailable` state.
        set +e
        python3 "$GITHUB_ACTION_PATH/../../tools/hermaguard-prescan/hermaguard-prescan.py" \
          --files-from "$RUNNER_TEMP/hermaguard/files.list" \
          --output "$RUNNER_TEMP/hermaguard/prescan.json" \
          >"$RUNNER_TEMP/hermaguard/scan.log" 2>&1
        echo "$?" >"$RUNNER_TEMP/hermaguard/scan_exit"
        cat "$RUNNER_TEMP/hermaguard/scan.log"
        exit 0

    - name: Summarise result and decide
      id: report
      if: ${{ always() }}
      shell: bash
      env:
        BLOCK_ON: ${{ inputs.block_on }}
        PRESCAN_ENABLED: ${{ inputs.prescan_enabled }}
      run: |
        python3 "$GITHUB_ACTION_PATH/hg_action.py" report

    - name: Post summary as PR comment
      if: ${{ github.event.pull_request && always() }}
      continue-on-error: true
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/hermaguard/comment.md`, 'utf8');
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

    - name: Enforce decision
      if: ${{ always() }}
      shell: bash
      run: |
        python3 "$GITHUB_ACTION_PATH/hg_action.py" enforce
