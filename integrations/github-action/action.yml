name: HermaGuard Code Review
description: Run adversarial code review on pull requests

inputs:
  block_on:
    description: Minimum severity to block merge (CRITICAL, HIGH, or never)
    default: 'CRITICAL'
  comment_mode:
    description: How to post findings (inline on diff lines, or summary comment)
    default: 'inline'
  min_severity:
    description: Minimum severity to report (LOW reports everything)
    default: 'MEDIUM'
  max_files:
    description: Skip if more than this many files changed
    default: '50'
  skip_patterns:
    description: File patterns to skip (newline-separated)
    default: '*.test.*\n*.spec.*\n*.md\n*.json\n*.yaml'
  hermaguard_args:
    description: Additional arguments for hermaguard
    default: ''
  prescan_enabled:
    description: Run deterministic pre-scan before LLM review
    default: 'true'

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install optional linters for the pre-scan
      shell: bash
      run: |
        # Best effort: the scanner reports which tools were missing.
        python3 -m pip install bandit ruff semgrep >/dev/null 2>&1 || true

    - name: Select changed files
      id: files
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.event.after }}
        SKIP_PATTERNS: ${{ inputs.skip_patterns }}
        MAX_FILES: ${{ inputs.max_files }}
      run: |
        python3 "$GITHUB_ACTION_PATH/hg_action.py" select

    - name: Run HermaGuard Pre-Scan
      if: ${{ steps.files.outputs.scan_count != '0' && inputs.prescan_enabled == 'true' }}
      id: prescan
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/hermaguard"
        python3 "$GITHUB_ACTION_PATH/../../tools/hermaguard-prescan/hermaguard-prescan.py" \
          --files-from "$RUNNER_TEMP/hermaguard/files.list" \
          --output "$RUNNER_TEMP/hermaguard/prescan.json" 2>&1 || true

    - name: Run HermaGuard
      if: ${{ steps.files.outputs.scan_count != '0' }}
      id: hermaguard
      shell: bash
      run: |
        echo "Running HermaGuard review..."
        # hermaguard is invoked via claude/codex as a skill
        # This step depends on the deployment environment
        # For CI, we use the json output mode
        echo "NOTE: Full HermaGuard LLM review requires an active Claude/Codex session."
        echo "See: https://github.com/Sahil-SS9/hermaguard for setup instructions."
        echo "Pre-scan output available at $RUNNER_TEMP/hermaguard/prescan.json"

    - name: Post findings as PR comments
      if: ${{ steps.files.outputs.changed_count != '0' && always() }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let body = '';

          // Use pre-scan output as the primary structured findings in CI
          // Full HermaGuard (LLM review) runs interactively; CI uses pre-scan
          try {
            const prescan = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/hermaguard/prescan.json`, 'utf8'));
            const stats = prescan.stats || {};

            body = `## 🔍 HermaGuard Pre-Scan

          **${stats.total_findings || 0} findings** from ${stats.tools_run?.join(', ') || 'no tools'}

          `;

            if (prescan.findings && prescan.findings.length > 0) {
              // Group by severity
              const groups = {};
              for (const f of prescan.findings) {
                const sev = f.severity || 'LOW';
                if (!groups[sev]) groups[sev] = [];
                if (groups[sev].length < 10) { // cap per severity
                  groups[sev].push(`- \`${f.file}:${f.line}\` — **${f.tool}** ${f.message}`);
                }
              }

              for (const [sev, items] of Object.entries(groups)) {
                body += `### ${sev}\n${items.join('\n')}\n\n`;
              }

              if (prescan.findings.length > 30) {
                body += `\n*${prescan.findings.length - 30} more findings truncated. See full output.*\n`;
              }
            } else {
              body += '✅ No deterministic issues found.\n';
            }

            body += `\n> Run \`/hermaguard\` for full adversarial LLM review.`;
          } catch (e) {
            body = `## 🔍 HermaGuard

          Pre-scan unavailable: ${e.message}

          Run \`/hermaguard\` locally for adversarial review.`;
          }

          // Post comment
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

    - name: Block on critical findings (optional)
      if: ${{ inputs.block_on != 'never' && steps.prescan.outcome == 'success' && always() }}
      shell: bash
      env:
        BLOCK_ON: ${{ inputs.block_on }}
      run: |
        REPORT="$RUNNER_TEMP/hermaguard/prescan.json"
        if [ -f "$REPORT" ]; then
          python3 - "$REPORT" "$BLOCK_ON" <<'PY'
        import json, sys
        report, block_on = sys.argv[1], sys.argv[2]
        data = json.load(open(report))
        sev = [f.get("severity") for f in data.get("findings", [])]
        crit = sev.count("CRITICAL")
        high = crit + sev.count("HIGH")
        if block_on == "CRITICAL" and crit:
            print(f"BLOCKING: {crit} CRITICAL findings detected.")
            sys.exit(1)
        if block_on == "HIGH" and high:
            print(f"BLOCKING: {high} CRITICAL+HIGH findings detected.")
            sys.exit(1)
        PY
        fi
        echo "No blocking findings."
